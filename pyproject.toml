[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopmoe"
version = "0.1.0"
description = "Long-Context Looped Mixture-of-Experts Transformer in Apple MLX with custom Metal fused kernels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Pratik Korat"}]
dependencies = [
    "mlx>=0.22.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loopmoe-train = "loopmoe.train:main"
loopmoe-generate = "loopmoe.generate:main"
loopmoe-bench = "loopmoe.kernels:run_parity_checks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
